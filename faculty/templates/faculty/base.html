<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Факультет природничих наук{% endblock %}</title>
  <style>
    :root {
      --green: #1f6f4a;
      --green-dark: #154d34;
      --bg: #f4f7f5;
      --text: #1d2a24;
      --muted: #6b7a72;
      --card: #ffffff;
      --border: #dfe7e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 1rem; }

    header { background: var(--green-dark); color: #fff; padding-top: 1.2rem; }
    header h1 { margin: 0 0 1rem; font-size: 1.5rem; }
    nav { display: flex; flex-wrap: wrap; gap: .25rem; }
    nav a {
      color: #d6efe2;
      text-decoration: none;
      padding: .6rem 1rem;
      border-radius: .5rem .5rem 0 0;
    }
    nav a:hover { background: var(--green); color: #fff; }
    nav a.active { background: var(--bg); color: var(--green-dark); font-weight: 600; }

    main { padding: 1.5rem 0 2rem; }
    h2 {
      margin: 2rem 0 1rem;
      padding-bottom: .3rem;
      border-bottom: 2px solid var(--green);
    }
    main h2:first-child { margin-top: 0; }
    h3 { margin: 0 0 .3rem; }
    a { color: var(--green); }
    small { color: var(--muted); }

    article {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: .75rem;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    article p { margin: .4rem 0; }

    main ul { padding-left: 1.2rem; }
    main li { margin-bottom: .7rem; }

    footer { padding: 1.5rem 0; color: var(--muted); border-top: 1px solid var(--border); }

    @media (max-width: 600px) {
      nav a { padding: .5rem .7rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Факультет природничих наук НаУКМА</h1>
      <nav>
        <a href="{% url 'faculty:home' %}" {% if request.path == '/' %}class="active"{% endif %}>Головна</a>
        <a href="{% url 'faculty:department_list' %}" {% if '/departments/' in request.path %}class="active"{% endif %}>Кафедри</a>
        <a href="{% url 'faculty:program_list' %}" {% if '/programs/' in request.path %}class="active"{% endif %}>Спеціальності</a>
        <a href="{% url 'faculty:research_list' %}" {% if '/research/' in request.path %}class="active"{% endif %}>Наука</a>
        <a href="{% url 'faculty:partner_list' %}" {% if '/partners/' in request.path %}class="active"{% endif %}>Партнери</a>
        <a href="{% url 'faculty:organization_list' %}" {% if '/students/' in request.path %}class="active"{% endif %}>Студентам</a>
        <a href="{% url 'exchange:exchange_list' %}" {% if '/exchange/' in request.path %}class="active"{% endif %}>Обмін</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="wrap">© НаУКМА, Факультет природничих наук</div>
  </footer>
</body>
</html>
